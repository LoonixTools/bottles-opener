<svg xmlns="http://www.w3.org/2000/svg" viewBox="-39.6 -28.1 596.2 596.2" width="512" height="512">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5fd0ff"/><stop offset=".45" stop-color="#2aa7e8"/><stop offset="1" stop-color="#0c62a0"/></linearGradient>
    <linearGradient id="cork" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2ad74"/><stop offset="1" stop-color="#a86f3c"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6edf5"/></linearGradient>
