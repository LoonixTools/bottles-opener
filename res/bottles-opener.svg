      <rect x="232" y="78" width="48" height="6.5" rx="3.25" fill="#9fb0c4"/>
      <rect x="232" y="92" width="30" height="6.5" rx="3.25" fill="#9fb0c4"/>
      <path d="M226 128 L226 206 C226 238 166 250 166 300 L166 412 C166 432 182 448 202 448 L310 448 C330 448 346 432 346 412 L346 300 C346 250 286 238 286 206 L286 128 Z" fill="url(#glass)"/>
      <path d="M196 304 C196 276 212 262 232 254" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="14" stroke-linecap="round"/>
